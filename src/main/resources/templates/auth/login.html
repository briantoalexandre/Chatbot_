<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Br'ia'nto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="login-page">
    <section class="login-card">

        <div class="brand"><span class="brand-mark">✺</span>Br'ia'nto</div>
        <h1 class="title">Connexion</h1>
        <p class="subtitle">Connectez-vous à votre espace personnel.</p>

        <div th:if="${param.error}" class="alert alert-error" role="alert">
            Adresse e-mail ou mot de passe incorrect, ou compte désactivé.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">
            Vous avez été déconnecté avec succès.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="fields">
                <label for="email">Adresse e-mail</label>
                <input id="email"
                       name="email"
                       type="email"
                       placeholder="nom@exemple.fr"
                       autocomplete="username"
                       required
                       autofocus>
            </div>

            <div class="fields">
                <label for="password">Mot de passe</label>
                <input id="password"
                       name="password"
                       type="password"
                       placeholder="Votre mot de passe"
                       autocomplete="current-password"
                       required>
            </div>

            <button class="btn primary submit" type="submit">Se connecter</button>
        </form>
    </section>
</main>
</body>
</html>
