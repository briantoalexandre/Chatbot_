<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: base(~{::content}, 'Détails du modèle', 'models')}">
<section th:fragment="content">
    <div class="heading">
        <div>
            <span class="eyebrow">CATALOGUE IA</span>
            <h1>Détails du modèle</h1>
            <p>Consultez les informations de ce modèle.</p>
        </div>
    </div>
    <div class="card">
        <h2 th:text="${modele.nom}">Nom du modèle</h2>
        <p th:text="${modele.description}">Description</p>
        <p>
            <strong>URL API :</strong>
            <span th:text="${modele.urlAPI}"></span>
        </p>
        <p>
            <strong>Logo :</strong>
            <span th:text="${modele.cheminLogo}"></span>
        </p>
        <a class="btn btn-warning"
           th:href="@{{id}/modifier(id=${modele.id})}">
            Modifier</a>
        <a class="btn outline" th:href="@{/modeles}">Retour à la liste</a>
    </div>
</section>
</html>
