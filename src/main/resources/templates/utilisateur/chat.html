<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: base(~{::content}, 'Chatbot', 'chat')}">
    <section th:fragment="content" class="chat-content">
    <div class="chat-page" th:attr="data-lecture-auto=${lectureAuto == true}">
    <div class="heading">
        <div>
            <span class="eyebrow">VOTRE ASSISTANT IA</span>
            <h1 th:text="${conversation != null ? conversation.titre : 'Bonjour !'}">Bonjour !</h1>
            <p>Posez vos questions, explorez vos idées et créez avec l’IA.</p>
        </div>
    </div>
    <div class="card chat-panel">
        <div th:if="${conversation == null and (messages == null or #lists.isEmpty(messages))}" class="empty-chat">
            <h2>Comment puis-je vous aider ?</h2>
            <p>Choisissez un modèle IA et posez votre question.</p>
        </div>
        <div class="messages" th:each="message : ${messages}">
            <div class="message"
                 th:classappend="${message.typeMessage.name() == 'ASSISTANT'} ? ' message-assistant' : ''">
                <strong th:text="${message.typeMessage}">UTILISATEUR</strong>
                <div class="message-content" th:utext="${message.contenu}">Contenu du message</div>
            </div>
        </div>
        <form class="composer" th:if="${conversation == null}" th:action="@{/conversations}" method="post">
            <select name="idModele" required>
                <option value="" disabled selected>Choisir un modèle IA</option>
                <option th:each="modele : ${modeles}" th:value="${modele.id}" th:text="${modele.nom}">Modèle</option>
            </select>
            <textarea name="prompt" rows="3" placeholder="Posez votre question..." required></textarea>
            <button class="btn primary" type="submit">Envoyer</button>
        </form>
        <form class="composer" th:if="${conversation != null}" th:action="@{/conversations/{id}/messages(id=${conversation.id})}" method="post">
            <textarea name="prompt" rows="3" placeholder="Écrivez votre message..." required></textarea>
            <button class="btn primary" type="submit">Envoyer</button>
        </form>
        <aside class="conversation-history">

            <a th:if="${conversation != null}"
               th:href="@{/}"
               class="btn primary new-chat">
                + New Chat
            </a>

            <h3>Chat History</h3>

            <div class="history-list">

                <a th:each="item : ${conversations}"
                   th:href="@{/conversations/{id}(id=${item.id})}"
                   th:classappend="${conversation != null
               and conversation.id == item.id} ? ' active' : ''"
                   class="history-item">

            <span th:text="${item.titre}">
                Conversation title
            </span>

                </a>

                <p th:if="${#lists.isEmpty(conversations)}">
                    No conversations yet.
                </p>

            </div>
        </aside>
    </div>
    </div>
    </section>
</html>
